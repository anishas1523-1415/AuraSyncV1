<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join me on AuraSynq</title>
  <meta property="og:title" content="Join me on AuraSynq">
  <meta property="og:description" content="You're invited to listen together on AuraSynq.">
  <meta property="og:image" content="https://aurasynq.web.app/icon-192x192.png">
  <meta name="theme-color" content="#090d18">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/share.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>
  <main class="card">
    <div class="cover-wrap"><img class="cover" src="/logo-emblem.png" alt=""></div>
    <p class="eyebrow">You're invited</p>
    <h1>Join me on AuraSynq</h1>
    <p class="artist">Blend our music or build a playlist together.</p>
    <a id="open" class="primary" href="#">Open in AuraSynq</a>
    <p class="hint" id="hint">Don't have the app? AuraSynq for Android is coming to Google Play.</p>
    <div class="brand"><img src="/logo-emblem.png" alt="" width="40" height="32"><span>AuraSynq</span></div>
  </main>
  <script>
    (function () {
      var deep = "o" + location.search;
      var open = document.getElementById("open");
      if (/Android/i.test(navigator.userAgent)) {
        open.href = "intent://" + deep + "#Intent;scheme=aurasynq;package=com.aurasynq.app;S.browser_fallback_url=" +
          encodeURIComponent(location.href) + ";end";
      } else {
        open.href = "aurasynq://" + deep;
        document.getElementById("hint").textContent = "AuraSynq is an Android app. Open this link on your Android phone to join.";
      }
    })();
  </script>
</body>
</html>
